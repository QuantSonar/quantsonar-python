[project]
name = "quantsonar"
version = "0.1.0"
description = "QuantSonar A 股量化数据 API 官方 Python SDK：行情、财务、资金流、龙虎榜，一个 Key 全部拿到"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "QuantSonar", email = "support@quantsonar.com" }]
keywords = ["quant", "a-share", "stock", "market-data", "tushare", "api"]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://quantsonar.com"
Documentation = "https://quantsonar.com/docs"
Repository = "https://github.com/QuantSonar/quantsonar-python"
Issues = "https://github.com/QuantSonar/quantsonar-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quantsonar"]
